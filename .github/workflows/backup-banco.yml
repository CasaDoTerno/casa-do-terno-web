name: Backup do banco (Neon)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar o backup
        env:
          DATABASE_URL: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          docker run --rm postgres:18 pg_dump "$DATABASE_URL" > backup-$(date +'%Y-%m-%d').sql

      - name: Guardar o backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco-casadoterno
          path: backup-*.sql
          retention-days: 90